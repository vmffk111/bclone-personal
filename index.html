<h1>개인용 bclone 연결 안내</h1>
<p>소유자가 자신의 PC에서 Google Drive의 폴더와 파일을 확인하고, 선택한 파일을 다운로드하거나 지정한 위치로 복사하기 위한 개인용 구성입니다. 업로드와 폴더 생성에도 사용합니다.</p>
<p>이 사이트는 설명용 정적 페이지입니다. 로그인, 파일 업로드, 인증 정보 입력 기능은 없으며 Google 또는 bclone 원 개발자의 공식 사이트가 아닙니다.</p>
